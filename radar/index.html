<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGC Radar de Editais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0C1A3D; --navy-2: #16295A; --navy-3: #22396F; --gold: #C8A84B; --gold-soft: #F6EFD9; --slate: #8799BA;
  --bg: #F3F5F9; --surface: #FFFFFF; --surface-2: #F7F8FB; --line: #E3E7EF; --line-2: #EEF1F6;
  --ink: #111A2E; --ink-2: #47516A; --ink-3: #7B849A;
  --novo: #0B7A3B; --novo-bg: #DFF5E7; --rec: #8A6A12; --rec-bg: #F7EED3;
  --crit: #B42318; --crit-bg: #FDE6E3; --warn: #9A5B00; --warn-bg: #FFF1D6; --ok: #0B7A3B;
  --link: #22396F; --bar: #22396F; --bar-hi: #C8A84B;
  --shadow: 0 1px 2px rgba(12,26,61,.05), 0 2px 8px rgba(12,26,61,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #121A2D; --surface-2: #172138; --line: #24304A; --line-2: #1C2740;
    --ink: #E7ECF5; --ink-2: #B3BDD1; --ink-3: #8390A9; --gold-soft: #2E2817;
    --novo: #5CD691; --novo-bg: #123222; --rec: #E2C46E; --rec-bg: #33290F;
    --crit: #FF8B7F; --crit-bg: #3B1714; --warn: #F3C266; --warn-bg: #3A2B0E; --ok: #5CD691;
    --link: #9DB6E8; --bar: #6F8FD0; --bar-hi: #D9B95C; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
button { font: inherit; }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

/* barra lateral */
.side { background: var(--navy); color: #DCE3F2; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.marca { display: flex; gap: 12px; align-items: center; padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.logo { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(145deg, #1B2F63, #0C1A3D); border: 1.5px solid var(--gold); display: grid; place-items: center; font-weight: 700; color: var(--gold); letter-spacing: .5px; font-size: 14px; }
.marca b { display: block; color: #fff; font-size: 15px; letter-spacing: .3px; }
.marca span { font-size: 11.5px; color: var(--slate); letter-spacing: .4px; text-transform: uppercase; }
.nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.nav .grupo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: #6F7FA3; padding: 14px 12px 6px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: #C9D2E6; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button.ativa { background: rgba(200,168,75,.14); color: #fff; box-shadow: inset 3px 0 0 var(--gold); }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .qt { margin-left: auto; font-size: 11.5px; color: #9AA8C7; font-variant-numeric: tabular-nums; }
.nav .qt b { color: var(--gold); font-weight: 600; margin-right: 4px; }
.side .rodape { margin-top: auto; padding: 14px 20px; font-size: 11.5px; color: #7D8DB0; border-top: 1px solid rgba(255,255,255,.08); }

/* topo */
.topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 28px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.topo h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.1px; }
.topo .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.topo .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--slate); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.prim { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.prim:hover { background: var(--navy-3); }
.btn.ouro { background: var(--gold); border-color: var(--gold); color: #1B1606; }
.btn svg { width: 15px; height: 15px; }
main { padding: 22px 28px 60px; max-width: 1500px; }
.aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }

/* indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--slate); }
.kpi.novo::before { background: var(--novo); } .kpi.rec::before { background: var(--gold); } .kpi.crit::before { background: var(--crit); }
.kpi .rot { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
.kpi .val { font-size: 30px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.kpi .det { font-size: 12px; color: var(--ink-3); }

/* blocos */
.grade2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; margin-bottom: 18px; }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.bloco > h3 { margin: 0; padding: 14px 18px 0; font-size: 14px; font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.bloco > h3 small { font-weight: 500; color: var(--ink-3); font-size: 12px; }
.bloco .corpo { padding: 12px 18px 16px; }
.grafico { position: relative; }
.grafico svg { display: block; width: 100%; height: 190px; }
.tip { position: absolute; pointer-events: none; background: var(--navy); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; transform: translate(-50%, -110%); white-space: nowrap; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.tabcat { width: 100%; border-collapse: collapse; }
.tabcat td { padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.tabcat tr:last-child td { border-bottom: 0; }
.tabcat td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; width: 60px; }
.tabcat td.n.novo { color: var(--novo); }
.tabcat tr { cursor: pointer; }
.tabcat tr:hover td { color: var(--link); }
.mini { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.mini:last-child { border-bottom: 0; }
.mini .d { flex: none; width: 52px; text-align: center; border-radius: 8px; padding: 4px 0; background: var(--crit-bg); color: var(--crit); font-weight: 700; font-size: 13px; line-height: 1.1; }
.mini .d small { display: block; font-weight: 500; font-size: 10.5px; }
.mini .t { font-size: 13px; }
.mini .t b { font-weight: 600; }
.mini .t span { color: var(--ink-3); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* listas */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 18px; align-items: start; }
.arvore { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow: auto; }
.arvore h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-3); padding: 14px 16px 8px; }
.reg { border-top: 1px solid var(--line-2); }
.reg > button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 16px; color: var(--ink); cursor: pointer; display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; }
.reg > button:hover, .cid:hover { background: var(--surface-2); }
.reg.sel > button, .cid.sel { background: var(--gold-soft); }
.reg .seta { color: var(--ink-3); font-size: 9px; transition: transform .15s; }
.reg.aberta .seta { transform: rotate(90deg); }
.reg .nome { font-weight: 600; font-size: 13px; }
.reg .uf { font-size: 10.5px; color: var(--ink-3); margin-left: 5px; }
.barra { grid-column: 2 / 4; height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
.nums { display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.cids { display: none; padding-bottom: 6px; }
.reg.aberta .cids { display: block; }
.cid { display: flex; justify-content: space-between; gap: 8px; padding: 5px 16px 5px 36px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.cid.zero { color: var(--ink-3); opacity: .7; }
.cid.cons { color: var(--ink); font-weight: 500; }
.cid.cons span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-t { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--rec); font-weight: 700; padding: 8px 16px 3px 36px; }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.filtros input[type=search], .filtros select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; }
.filtros input[type=search] { flex: 1 1 260px; min-width: 0; }
.filtros label { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; white-space: nowrap; cursor: pointer; }
.periodo { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.periodo button { border: 0; background: none; padding: 7px 11px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); }
.periodo button:last-child { border-right: 0; }
.periodo button.on { background: var(--navy); color: #fff; }
.linha-info { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); margin: 6px 0 10px; }
.chip-sel { display: inline-flex; gap: 6px; align-items: center; background: var(--gold-soft); color: var(--ink); border-radius: 14px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.chip-sel button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 15px; padding: 0; line-height: 1; }
.divisor { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-3); font-weight: 600; }
.divisor::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divisor.ouro { color: var(--rec); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); border-left: 4px solid var(--line); }
.card.novo { border-left-color: var(--novo); }
.card.rec { border-left-color: var(--gold); }
.card.inativo { opacity: .55; }
.card .l1 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 6px; }
.card .local { font-weight: 650; font-size: 14.5px; }
.card .org { color: var(--ink-3); font-size: 12.5px; }
.card .pub { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.card .pub b { font-weight: 600; color: var(--ink); }
.card .obj { margin: 4px 0 10px; color: var(--ink); line-height: 1.5; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--ink-2); }
.card .meta b { color: var(--ink); font-weight: 600; }
.card .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.selo { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 2px 7px; letter-spacing: .4px; text-transform: uppercase; }
.selo.novo { background: var(--novo); color: #fff; }
.selo.rec { background: var(--rec-bg); color: var(--rec); }
.selo.alta { background: #E3E9F7; color: var(--navy-3); }
.selo.verif { background: var(--warn-bg); color: var(--warn); }
.selo.cat { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.selo.enc { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .selo.alta { background: #1D2B4D; color: #A9C0EE; } }
.prazo { display: inline-flex; gap: 4px; align-items: center; font-weight: 600; }
.prazo.crit { color: var(--crit); }
.st { font-size: 12.5px; font-weight: 600; }
.st.aguard { color: var(--warn); } .st.ok { color: var(--ok); } .st.erro { color: var(--crit); font-weight: 500; }
select.acomp { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12.5px; }
select.acomp.on { border-color: var(--gold); background: var(--gold-soft); font-weight: 600; }
.vazio { text-align: center; color: var(--ink-3); padding: 44px 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.mais { display: block; margin: 14px auto; }
table.ed { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
table.ed th, table.ed td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: top; font-size: 13px; }
table.ed th { background: var(--surface-2); color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 120px; }
.col h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-2); display: flex; justify-content: space-between; }
.kc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px; box-shadow: var(--shadow); }
.kc b { display: block; font-size: 13px; }
.kc .o { color: var(--ink-2); margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kc .r { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--ink-3); }
.menu-mob { display: none; }
@media (max-width: 1100px) { .grade2 { grid-template-columns: 1fr; } .kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; }
  .nav { flex-direction: row; overflow-x: auto; padding: 8px; }
  .nav .grupo, .side .rodape { display: none; }
  .nav button { width: auto; white-space: nowrap; }
  .layout { grid-template-columns: 1fr; }
  .arvore { position: static; max-height: 320px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main, .topo { padding-left: 16px; padding-right: 16px; }
  .card .pub { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca"><div class="logo">BGC</div><div><b>BGC Consultoria</b><span>Radar de Editais</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rodape" id="rodape"></div>
  </aside>
  <div>
    <header class="topo">
      <div><h1 id="titulo">Visão geral</h1><div class="sub" id="sub"></div></div>
      <div class="acoes">
        <button class="btn" id="btExportar" title="Baixa a lista filtrada em planilha (CSV)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>Exportar lista</button>
        <button class="btn" id="btRecarregar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Recarregar</button>
        <button class="btn prim" id="btAtualizar" title="Roda a busca no PNCP agora (cerca de 10 minutos)">Buscar agora</button>
      </div>
    </header>
    <main>
      <div id="avisos"></div>
      <section class="kpis" id="kpis"></section>
      <div id="corpo"></div>
    </main>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>

</script>

// nome curto de consórcio: sigla quando houver (ex.: CISAMSF), senão o nome em caixa normal
function nomeConsorcio(o) {
  const s = String(o || '').trim();
  const m = s.match(/(?:\s[-–]\s*|\()\s*([A-Z][A-Z0-9\/.-]{2,})\)?\.?\s*$/) || s.match(/\b(CIS[A-Z]{2,}|CI[A-Z]{3,}|COD[A-Z]{3,})\b/);
  const t = s.toLowerCase().replace(/(^|\s)(\S)/g, (a, b, c) => b + c.toUpperCase()).replace(/\b(De|Do|Da|Dos|Das|E)\b/g, w => w.toLowerCase());
  return m ? `${m[1]} · ${t.replace(/\s*[-–(].*$/, '').slice(0, 60)}` : t.slice(0, 70);
}
const REL = { alta: ['Relevância alta', 'alta'], verificar: ['Verificar', 'verif'], consorcio: ['Consórcio', 'verif'] };

const API = noServidor ? '' : 'http://localhost:8765';

// datas: NOVO = publicado hoje ou ontem; RECENTE = publicado nos últimos 30 dias
const iso = d => d.toISOString().slice(0, 10);
const HOJE = D.hoje || iso(new Date());
const somaDias = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const LIM_NOVO = somaDias(HOJE, -1), LIM_REC = somaDias(HOJE, -30);
const pub = i => (i.publicado || '').slice(0, 10);
const ehNovo = i => pub(i) >= LIM_NOVO;
const ehRec = i => !ehNovo(i) && pub(i) >= LIM_REC;
const ativo = i => i.ativo === 'sim';
const diasAte = s => { if (!s) return null; const d = new Date(s); return isNaN(d) ? null : Math.ceil((d - new Date()) / 86400000); };
const diasDesde = s => s ? Math.round((new Date(HOJE + 'T12:00:00') - new Date(s.slice(0, 10) + 'T12:00:00')) / 86400000) : null;
const fData = s => { if (!s) return '—'; const d = new Date(s.length <= 10 ? s + 'T12:00:00' : s); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR'); };
const fHora = s => { if (!s || s.length <= 10 || /T00:00:00/.test(s)) return ''; const d = new Date(s); return isNaN(d) ? '' : ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const haQuanto = s => { const n = diasDesde(s); return n === null ? '' : n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`; };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nomeReg = r => NOME_REG[r] || r;

let fila = {}, marc = {};
let E = { pag: 'geral', regiao: null, cidade: null, orgao: null, busca: '', tipo: '', periodo: 'todos', ordem: 'pub', encerrados: false, abertas: new Set(), limite: 50 };
try { const s = JSON.parse(localStorage.getItem('bgcRadar') || '{}'); if (s.pag && PAGINAS.some(p => p.id === s.pag)) E.pag = s.pag; if (s.ordem) E.ordem = s.ordem; } catch (e) {}
const pagAtual = () => PAGINAS.find(p => p.id === E.pag);

function daCat(cat, incluiEnc) { return D.itens.filter(i => (cat === 'mei' ? i.mei === 'sim' : i.cat === cat) && (incluiEnc || ativo(i))); }
function filtrados() {
  const p = pagAtual(); const q = norm(E.busca);
  const lim = E.periodo === 'novos' ? LIM_NOVO : E.periodo === '7' ? somaDias(HOJE, -7) : E.periodo === '30' ? LIM_REC : '';
  const l = daCat(p.cat, E.encerrados).filter(i =>
    (!E.regiao || i.regiao === E.regiao) && (!E.cidade || i.cidade === E.cidade) && (!E.orgao || i.orgao === E.orgao) &&
    (!lim || pub(i) >= lim) &&
    (!E.tipo || (p.cat === 'principal' ? i.relev === E.tipo : p.cat === 'mei' ? i.meiTipo === E.tipo : i.sub === E.tipo)) &&
    (!q || norm(`${i.objeto} ${i.orgao} ${i.cidade} ${i.modalidade} ${i.processo}`).includes(q)));
  const prazo = i => { const d = diasAte(i.encerramento); return d === null || d < 0 ? 99999 : d; };
  if (E.ordem === 'prazo') l.sort((a, b) => prazo(a) - prazo(b) || pub(b).localeCompare(pub(a)));
  else if (E.ordem === 'cidade') l.sort((a, b) => String(a.cidade).localeCompare(String(b.cidade)) || pub(b).localeCompare(pub(a)));
  else l.sort((a, b) => pub(b).localeCompare(pub(a)) || prazo(a) - prazo(b));
  return l;
}

function renderGeral() {
  const at = D.itens.filter(ativo);
  // publicações por dia (30 dias)
  const dias = []; for (let k = 29; k >= 0; k--) dias.push(somaDias(HOJE, -k));
  const cont = Object.fromEntries(dias.map(d => [d, 0])); at.forEach(i => { if (cont[pub(i)] !== undefined) cont[pub(i)]++; });

    <select id="fOrdem" title="Ordenar"><option value="pub" ${E.ordem === 'pub' ? 'selected' : ''}>Mais recentes primeiro</option><option value="prazo" ${E.ordem === 'prazo' ? 'selected' : ''}>Prazo mais próximo</option><option value="cidade" ${E.ordem === 'cidade' ? 'selected' : ''}>Cidade (A–Z)</option></select>
  </div>
  <div class="filtros"><span style="font-size:12.5px;color:var(--ink-3)">Publicação:</span><div class="periodo">${per.map(([v, t]) => `<button data-per="${v}" class="${E.periodo === v ? 'on' : ''}">${t}</button>`).join('')}</div>
    <label><input type="checkbox" id="fEnc" ${E.encerrados ? 'checked' : ''}> Incluir encerrados</label></div>`;
  h += `<div class="linha-info"><span>${l.length} processo(s)${E.ordem === 'pub' ? ' · do mais novo ao mais antigo (data de publicação)' : ''}</span>${E.regiao || E.cidade || E.orgao ? `<span class="chip-sel">${esc(E.orgao ? nomeConsorcio(E.orgao) : E.cidade || nomeReg(E.regiao))}<button id="limparSel" title="Limpar">×</button></span>` : ''}</div>`;
  if (!l.length) return `<div>${h}<div class="vazio">Nenhum processo com esses filtros.</div></div>`;
  let grupo = null;
  l.slice(0, E.limite).forEach(i => {
    if (E.ordem === 'pub') {
      const g = ehNovo(i) ? 'n' : pub(i) >= LIM_REC ? 'r' : 'a';
      if (g !== grupo) { grupo = g; h += { n: '<div class="divisor" style="color:var(--novo)">Novos — publicados hoje ou ontem</div>', r: '<div class="divisor ouro">Recentes — publicados nos últimos 30 dias</div>', a: '<div class="divisor">Publicados há mais de 30 dias (ainda abertos)</div>' }[g]; }
    }
    h += card(i);
  });
  if (l.length > E.limite) h += `<button class="btn mais" id="mais">Mostrar mais (${l.length - E.limite} restantes)</button>`;
  return `<div>${h}</div>`;
}

function stEdital(f) {
  if (!f) return '';
  if (f.status === 'analisado') return `<span class="st ok">✓ Analisado${f.recomendacao ? ' · ' + esc(f.recomendacao) : ''}</span>`;
  return '<span class="st ok">✓ Baixado</span>';
}
function card(i, rotCat) {
  const d = diasAte(i.encerramento);
  const prazo = i.encerramento ? `<span class="prazo ${d !== null && d >= 0 && d <= 7 ? 'crit' : ''}">${fData(i.encerramento)}${fHora(i.encerramento)}${d !== null && d >= 0 ? ` · ${d === 0 ? 'encerra hoje' : 'faltam ' + d + (d === 1 ? ' dia' : ' dias')}` : ''}</span>` : '—';
  const tag = i.cat === 'principal' ? `<span class="selo ${REL[i.relev]?.[1] || 'verif'}">${REL[i.relev]?.[0] || ''}</span>` : `<span class="selo cat">${SUB[i.sub] || ''}</span>`;
  const f = fila[i.id]; const m = marc[i.id];
  const fora = /^(MAPA|WEB|DOU|AMM|FGM|AGM)-/.test(i.id);
  const ac = [];
  if (fora) ac.push(`<a class="btn prim" href="${esc(i.linkPNCP)}" target="_blank" rel="noopener">Abrir edital</a>`);
  else if (f) { ac.push(`<button class="btn" data-abrir="${esc(i.id)}">Abrir pasta</button>`); if (f.status === 'analisado' && f.relatorio) ac.push(`<a class="btn ouro" href="${API}/relatorio?id=${encodeURIComponent(i.id)}" target="_blank">Ver análise</a>`); ac.push(stEdital(f)); }
  else ac.push(`<button class="btn prim" data-baixar="${esc(i.id)}">Baixar edital</button>`);
  if (!fora) ac.push(`<a class="btn" href="${esc(i.linkPNCP)}" target="_blank" rel="noopener">PNCP</a>`);
  if (i.linkOrigem) ac.push(`<a class="btn" href="${esc(i.linkOrigem)}" target="_blank" rel="noopener">Sistema de origem</a>`);
  if (temServidor) ac.push(`<select class="acomp ${m && m.etapa ? 'on' : ''}" data-marcar="${esc(i.id)}">${ETAPAS.map(([k, n]) => `<option value="${k}" ${(m && m.etapa || '') === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`);
  const cls = ehNovo(i) ? 'novo' : ehRec(i) ? 'rec' : '';
  return `<article class="card ${cls} ${ativo(i) ? '' : 'inativo'}" id="c-${esc(i.id)}">
    <div class="l1">${ehNovo(i) ? '<span class="selo novo">Novo</span>' : ehRec(i) ? '<span class="selo rec">Recente</span>' : ''}${rotCat ? `<span class="selo cat">${rotCat}</span>` : ''}${tag}${i.mei === 'sim' && i.meiTipo ? `<span class="selo cat" title="${esc(SUB[i.meiTipo] || '')}">MEI · ${esc(SUB[i.meiTipo] || '')}</span>` : ''}${ativo(i) ? '' : '<span class="selo enc">Encerrado</span>'}
      <span class="local">${esc(i.cidade || nomeReg(i.regiao))}${i.uf && i.cidade && i.cidade !== 'Brasil' ? ' – ' + esc(i.uf) : ''}</span><span class="org">${esc(i.orgao)}</span>
      <span class="pub">Publicado em <b>${fData(pub(i))}</b>${pub(i) ? ' · ' + haQuanto(pub(i)) : ''}</span></div>
    <div class="obj">${esc(i.objeto)}</div>
    <div class="meta"><span><b>Modalidade:</b> ${esc(i.modalidade)}</span>${i.processo ? `<span><b>Processo:</b> ${esc(i.processo)}</span>` : ''}<span><b>Encerramento:</b> ${prazo}</span>${i.valor && +i.valor > 0 ? `<span><b>Valor estimado:</b> ${(+i.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>` : ''}${i.fonte && i.fonte !== 'PNCP' ? `<span><b>Fonte:</b> ${esc(i.fonte)}</span>` : ''}</div>
    <div class="acoes" data-acoes="${esc(i.id)}">${ac.join('')}</div></article>`;
}

/* ---------- acompanhamento e editais ---------- */
function renderAcomp() {
  const porId = Object.fromEntries(D.itens.map(i => [i.id, i]));
  const cols = ETAPAS.slice(1).map(([k, n]) => {
    const its = Object.entries(marc).filter(([id, m]) => m && m.etapa === k).map(([id, m]) => ({ i: porId[id], m, id }));
    return `<div class="col"><h4>${n}<span>${its.length}</span></h4>${its.map(({ i, m, id }) => i ? `<div class="kc"><b>${esc(i.cidade || nomeReg(i.regiao))}${i.uf ? ' – ' + i.uf : ''}</b><div class="o">${esc(i.objeto)}</div><div class="r"><span>${i.encerramento ? 'Encerra ' + fData(i.encerramento) : ''}</span><select class="acomp on" data-marcar="${esc(id)}">${ETAPAS.map(([kk, nn]) => `<option value="${kk}" ${kk === k ? 'selected' : ''}>${kk ? nn : 'Remover'}</option>`).join('')}</select></div></div>` : '').join('') || '<div style="color:var(--ink-3);font-size:12.5px">Nenhum processo.</div>'}</div>`;
  }).join('');
  return (temServidor ? '' : '<div class="aviso">Abra pelo atalho para usar o acompanhamento.</div>') + `<div class="kanban">${cols}</div><p style="color:var(--ink-3);font-size:12.5px;margin-top:14px">Use o seletor <b>Acompanhar…</b> em qualquer processo para trazê-lo para cá. As marcações ficam salvas neste computador.</p>`;
}
function renderEditais() {
  const v = Object.values(fila).sort((a, b) => String(b.baixadoEm).localeCompare(String(a.baixadoEm)));
  if (!v.length) return '<div class="vazio">Nenhum edital baixado ainda. Use <b>Baixar edital</b> em um processo.</div>';
  return `<table class="ed"><thead><tr><th>Cidade / órgão</th><th>Objeto</th><th>Encerramento</th><th>Baixado em</th><th>Situação</th><th></th></tr></thead><tbody>${v.map(f => `<tr><td><b>${esc(f.cidade)} – ${esc(f.uf)}</b><br><span style="color:var(--ink-3)">${esc(f.orgao)}</span></td><td>${esc(f.objeto)}<br><span style="color:var(--ink-3);font-size:12px">${(f.arquivos || []).length} arquivo(s)</span></td><td>${fData(f.encerramento)}</td><td>${fData(f.baixadoEm)}</td><td>${stEdital(f)}</td><td style="white-space:nowrap">${f.status === 'analisado' && f.relatorio ? `<a class="btn ouro" href="${API}/relatorio?id=${encodeURIComponent(f.id)}" target="_blank">Ver análise</a> ` : ''}<button class="btn" data-abrir="${esc(f.id)}">Pasta</button></td></tr>`).join('')}</tbody></table>`;
}

function render() {
  try { localStorage.setItem('bgcRadar', JSON.stringify({ pag: E.pag, ordem: E.ordem })); } catch (e) {}
  renderNav(); renderTopo(); renderKpis();
  const foco = document.activeElement && document.activeElement.id;
  const p = pagAtual();
  $('#corpo').innerHTML = p.id === 'geral' ? renderGeral() : p.id === 'acomp' ? renderAcomp() : p.id === 'editais' ? renderEditais() : `<div class="layout">${renderArvore()}${renderLista()}</div>`;
  if (foco === 'fBusca') { const el = $('#fBusca'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}
function irPara(pag) { E.pag = pag; E.regiao = null; E.cidade = null; E.orgao = null; E.tipo = ''; E.busca = ''; E.periodo = 'todos'; E.limite = 50; window.scrollTo(0, 0); render(); }

function exportar() {
  const l = filtrados();
  const col = ['Destaque', 'Publicado', 'Categoria', 'Região/Esfera', 'Cidade', 'UF', 'Órgão', 'Modalidade', 'Processo', 'Objeto', 'Encerramento', 'Link', 'Sistema de origem', 'Acompanhamento'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhas = l.map(i => [ehNovo(i) ? 'NOVO' : ehRec(i) ? 'RECENTE' : '', fData(pub(i)), i.cat === 'principal' ? (REL[i.relev]?.[0] || '') : (SUB[i.sub] || ''), nomeReg(i.regiao), i.cidade, i.uf, i.orgao, i.modalidade, i.processo, i.objeto, fData(i.encerramento) + fHora(i.encerramento), i.linkPNCP, i.linkOrigem, (ETAPAS.find(e => e[0] === (marc[i.id]?.etapa || '')) || ['', ''])[1].replace('Acompanhar…', '')].map(q).join(';'));
  const blob = new Blob(['﻿' + [col.map(q).join(';'), ...linhas].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `BGC_${pagAtual().nome.replace(/\s+/g, '_')}_${HOJE}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button, .cid, tr[data-ir], .mini'); if (!t) return;
  if (t.dataset.pag) return irPara(t.dataset.pag);
  if (t.dataset.ir) return irPara(t.dataset.ir);
  if (t.dataset.foco) { const i = D.itens.find(x => x.id === t.dataset.foco); if (i) { irPara(i.cat); E.busca = i.processo || i.objeto.slice(0, 40); render(); } return; }
  if (t.id === 'mais') { E.limite += 50; return render(); }
  if (t.id === 'limparSel') { E.regiao = null; E.cidade = null; E.orgao = null; return render(); }
  if (t.id === 'btRecarregar') return location.reload();
  if (t.id === 'btExportar') return exportar();
  if (t.dataset.per) { E.periodo = t.dataset.per; E.limite = 50; return render(); }
  if (t.id === 'btAtualizar') {
    t.disabled = true; t.textContent = 'Buscando…';
    try { const r = await fetch(API + '/api/atualizar', { method: 'POST' }).then(r => r.json()); alert(r.msg || r.erro); } catch (err) { alert('O servidor do painel não respondeu.'); }
    t.textContent = 'Buscar agora'; t.disabled = false; return;
  }
  if (t.classList.contains('cid')) { E.regiao = t.dataset.reg; E.cidade = t.dataset.cid || null; E.orgao = t.dataset.org || null; E.limite = 50; return render(); }
  if (t.dataset.reg !== undefined && t.closest('.reg')) {
    const r = t.dataset.reg;
    E.orgao = null;
    if (!r) { E.regiao = null; E.cidade = null; return render(); }
    if (E.regiao === r && !E.cidade && E.abertas.has(r)) E.abertas.delete(r); else E.abertas.add(r);
    E.regiao = r; E.cidade = null; E.limite = 50; return render();
  }
  if (t.dataset.baixar) {
    const id = t.dataset.baixar;
    if (!temServidor) { const i = D.itens.find(x => x.id === id); window.open(i.linkPNCP, '_blank'); return; }
    t.disabled = true; t.textContent = 'Baixando edital…';
    try {
      const r = await fetch(API + '/api/baixar?id=' + encodeURIComponent(id), { method: 'POST' }); const j = await r.json();
      if (!r.ok) throw new Error(j.erro || 'Falha ao baixar');
      fila[id] = j; render();
    } catch (err) {
      t.disabled = false; t.textContent = 'Baixar edital';
      document.querySelector(`[data-acoes="${CSS.escape(id)}"]`).insertAdjacentHTML('beforeend', `<span class="st erro">${esc(err.message)}</span>`);
    }
    return;
  }
  if (t.dataset.abrir) { fetch(API + '/api/abrir?id=' + encodeURIComponent(t.dataset.abrir), { method: 'POST' }); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'fBusca') { E.busca = e.target.value; E.limite = 50; render(); } });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.marcar) {
    const id = t.dataset.marcar, etapa = t.value;
    try { const r = await fetch(`${API}/api/marcar?id=${encodeURIComponent(id)}&etapa=${encodeURIComponent(etapa)}`, { method: 'POST' }).then(r => r.json()); marc = r.marcacoes || marc; } catch (err) { alert('Não foi possível salvar o acompanhamento.'); }
    return render();
  }
  if (t.id === 'fTipo') E.tipo = t.value; else if (t.id === 'fOrdem') E.ordem = t.value; else if (t.id === 'fEnc') E.encerrados = t.checked; else return;
  E.limite = 50; render();
});

// dica do gráfico
document.addEventListener('mousemove', e => {
  const tip = $('#tip'); const h = e.target.closest && e.target.closest('rect.hit');
  if (!h) { tip.style.display = 'none'; return; }
  const v = +h.dataset.v; tip.innerHTML = `<b>${fData(h.dataset.d)}</b> · ${v} edital${v === 1 ? '' : 'is'} publicado${v === 1 ? '' : 's'}`;
  tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + window.scrollY + 'px'; tip.style.position = 'absolute'; tip.style.display = 'block';
});

async function carregar() {
  if (!temServidor) return;
  try { const v = await fetch(API + '/api/fila').then(r => r.json()); fila = Object.fromEntries((v || []).map(f => [f.id, f])); } catch (e) {}
  try { marc = await fetch(API + '/api/marcacoes').then(r => r.json()) || {}; } catch (e) {}
}
render();
carregar().then(render);
verificarServidor(); setInterval(verificarServidor, 5000);
setInterval(() => temServidor && carregar().then(() => { if (!document.activeElement || !['fBusca'].includes(document.activeElement.id)) render(); }), 60000);
</script>
</body>
</html>
